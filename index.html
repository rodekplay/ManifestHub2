<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор Steam Lua Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #2c2f33 0%, #23272a 100%);
            padding: 20px;
        }
        .glass-card {
            max-width: 750px;
            width: 100%;
            background: rgba(44, 47, 51, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 40px 32px;
            box-shadow: 0 25px 40px -10px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.03);
        }
        .title {
            text-align: center;
            font-weight: 600;
            font-size: 1.8rem;
            color: #f0f2f5;
            margin-bottom: 8px;
        }
        .title span {
            background: linear-gradient(135deg, #b7bdc6, #d1d7e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub-head {
            text-align: center;
            color: #8e9297;
            margin-bottom: 32px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }
        .input-group label {
            font-weight: 500;
            color: #c4c9ce;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .input-row input {
            flex: 2;
            min-width: 180px;
            background: #2f3136;
            border: 1px solid #40444b;
            border-radius: 40px;
            padding: 14px 22px;
            font-size: 1rem;
            color: #f0f2f5;
            outline: none;
            transition: 0.2s;
        }
        .input-row input:focus {
            border-color: #6c8cff;
            background: #35393f;
            box-shadow: 0 0 0 3px rgba(108,140,255,0.15);
        }
        .input-row input::placeholder { color: #6a6f78; }
        .btn-primary {
            flex: 0 0 auto;
            background: #5865f2;
            border: none;
            border-radius: 40px;
            padding: 14px 32px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(88,101,242,0.3);
        }
        .btn-primary:hover { background: #4752c4; transform: scale(1.02); }
        .btn-primary:disabled { opacity: 0.7; cursor: default; transform: none; }
        #results {
            margin-top: 20px;
            background: rgba(0,0,0,0.25);
            border-radius: 28px;
            padding: 18px 20px;
        }
        .terminal {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #b9bbbe;
            background: #1e1f22;
            padding: 16px 18px;
            border-radius: 20px;
            min-height: 60px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            border-left: 3px solid #5865f2;
            max-height: 350px;
            overflow-y: auto;
        }
        .terminal .success { color: #57f287; }
        .terminal .error { color: #f04747; }
        .terminal .info { color: #6c8cff; }
        .terminal .warning { color: #faa81a; }
        .hidden { display: none !important; }
        .download-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .download-btn {
            flex: 1;
            min-width: 120px;
            background: #2f3136;
            border: 1px solid #40444b;
            border-radius: 30px;
            padding: 10px 20px;
            color: #d1d7e0;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .download-btn:hover { background: #40444b; border-color: #6c8cff; }
        .download-btn i { margin-right: 8px; }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .badge-error {
            background: #da373c20;
            border: 1px solid #da373c60;
            border-radius: 40px;
            padding: 8px 20px;
            color: #f6a8ab;
            display: inline-block;
            margin-top: 12px;
        }
        .badge-success {
            background: #57f28720;
            border: 1px solid #57f28760;
            border-radius: 40px;
            padding: 8px 20px;
            color: #57f287;
            display: inline-block;
            margin-top: 12px;
        }
        .badge-info {
            background: #6c8cff20;
            border: 1px solid #6c8cff60;
            border-radius: 40px;
            padding: 8px 20px;
            color: #6c8cff;
            display: inline-block;
            margin-top: 12px;
        }
        @media (max-width: 550px) {
            .glass-card { padding: 28px 18px; }
            .input-row { flex-direction: column; }
            .input-row input { width: 100%; }
            .btn-primary { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="glass-card">
    <div class="title"><span>Генератор Steam Lua Tools</span></div>
    <div class="sub-head">быстрый поиск по JSON-файлам</div>

    <div class="input-group">
        <label for="gameId"><i class="fas fa-hashtag"></i> Введите AppID игры</label>
        <div class="input-row">
            <input type="text" id="gameId" placeholder="Например, 621060" />
            <button id="generateBtn" class="btn-primary">
                <i class="fas fa-cog"></i> Сгенерировать
            </button>
        </div>
    </div>

    <div id="results" class="hidden">
        <div class="terminal" id="terminalOutput"></div>
        <div id="downloadSection" class="hidden">
            <div class="download-buttons">
                <button class="download-btn" id="downloadLua"><i class="fas fa-file-code"></i> Скачать .lua</button>
                <button class="download-btn" id="downloadManifest"><i class="fas fa-file-alt"></i> Скачать .manifest</button>
            </div>
        </div>
        <div id="statusBadge"></div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        const gameIdInput = document.getElementById('gameId');
        const generateBtn = document.getElementById('generateBtn');
        const results = document.getElementById('results');
        const terminalOutput = document.getElementById('terminalOutput');
        const downloadSection = document.getElementById('downloadSection');
        const statusBadge = document.getElementById('statusBadge');
        const downloadLua = document.getElementById('downloadLua');
        const downloadManifest = document.getElementById('downloadManifest');

        let currentLuaContent = '';
        let currentManifestContent = '';

        // === БЫСТРЫЙ ПОИСК В JSON (ускоренный) ===
        async function findValueInJson(url, key, fileSize) {
            const chunkSize = 128 * 1024; // 128KB для быстрого поиска
            let position = 0;
            
            while (position < fileSize) {
                const end = Math.min(position + chunkSize - 1, fileSize - 1);
                const response = await fetch(url, {
                    headers: { 'Range': `bytes=${position}-${end}` }
                });

                if (!response.ok && response.status !== 206) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const chunk = await response.text();
                
                // Ищем ключ
                const pattern = new RegExp(`"${key}"\\s*:\\s*"([^"]+)"`);
                const match = chunk.match(pattern);
                
                if (match) {
                    return match[1];
                }

                position += chunkSize;
            }

            return null;
        }

        // === СБОР ВСЕХ ДЕПОТОВ (ускоренный) ===
        async function findAllDepots(url, fileSize) {
            const chunkSize = 512 * 1024; // 512KB для быстрого сбора
            let position = 0;
            const depots = {};

            while (position < fileSize) {
                const end = Math.min(position + chunkSize - 1, fileSize - 1);
                const response = await fetch(url, {
                    headers: { 'Range': `bytes=${position}-${end}` }
                });

                if (!response.ok && response.status !== 206) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const chunk = await response.text();
                
                // Собираем все depots в чанке
                const regex = /"(\d+)":\s*"([^"]+)"/g;
                let match;
                while ((match = regex.exec(chunk)) !== null) {
                    depots[match[1]] = match[2];
                }

                position += chunkSize;
            }

            return depots;
        }

        // === ПОЛУЧЕНИЕ РАЗМЕРА ФАЙЛА ===
        async function getFileSize(url) {
            const response = await fetch(url, { method: 'HEAD' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return parseInt(response.headers.get('content-length')) || 0;
        }

        // === ГЕНЕРАЦИЯ ФАЙЛОВ ===
        function generateFiles(appId, depots) {
            const sortedDepots = Object.entries(depots).sort((a, b) => parseInt(a[0]) - parseInt(b[0]));

            let lua = `addappid(${appId})\n`;
            
            // Добавляем все depots
            for (const [depotId, manifestId] of sortedDepots) {
                lua += `addappid(${depotId})\n`;
                lua += `setManifestid(${depotId},"${manifestId}")\n`;
            }

            let manifest = `{\n  "appid": ${appId},\n  "depots": {\n`;
            const depotEntries = sortedDepots.map(([depotId, manifestId]) => {
                return `    "${depotId}": {\n      "manifestid": "${manifestId}"\n    }`;
            });
            manifest += depotEntries.join(',\n');
            manifest += `\n  }\n}`;

            return { lua, manifest };
        }

        // === ОСНОВНАЯ ФУНКЦИЯ ===
        async function generate() {
            const appId = gameIdInput.value.trim();

            if (!appId || !/^\d+$/.test(appId)) {
                results.classList.remove('hidden');
                downloadSection.classList.add('hidden');
                statusBadge.innerHTML = `<span class="badge-error"><i class="fas fa-circle-exclamation"></i> Введите корректный AppID</span>`;
                terminalOutput.innerHTML = `<span class="error">⚠️ Ошибка: введите корректный Steam AppID (только цифры).</span>`;
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span class="spinner"></span> Поиск...';
            results.classList.remove('hidden');
            downloadSection.classList.add('hidden');
            statusBadge.innerHTML = '';
            terminalOutput.innerHTML = `<span class="info">🔍 Поиск для AppID: ${appId}...</span>`;

            const baseUrl = 'https://raw.githubusercontent.com/rodekplay/ManifestHub2/main/';

            try {
                // Получаем размеры файлов
                const [tokensSize, depotsSize] = await Promise.all([
                    getFileSize(baseUrl + 'appaccesstokens.json'),
                    getFileSize(baseUrl + 'depotkeys.json')
                ]);

                // Ищем токен
                const token = await findValueInJson(baseUrl + 'appaccesstokens.json', appId, tokensSize);
                
                // Ищем депоты
                const depots = await findAllDepots(baseUrl + 'depotkeys.json', depotsSize);

                // Проверяем, есть ли депоты, которые относятся к нашему AppID
                // В depotkeys.json ключи - это depotId, их много, мы берем все
                const relevantDepots = {};
                for (const [depotId, manifestId] of Object.entries(depots)) {
                    // Проверяем, начинается ли depotId с нашего appId или просто берем все
                    // Так как в файле только depotId -> manifestId, мы берем все
                    // Но чтобы не было слишком много, возьмем только те, что связаны с игрой
                    // В вашем случае, видимо, все depots нужны
                    relevantDepots[depotId] = manifestId;
                }

                if (Object.keys(relevantDepots).length === 0) {
                    terminalOutput.innerHTML = `<span class="warning">⚠️ Депоты не найдены. Будет создан базовый файл.</span>`;
                } else {
                    terminalOutput.innerHTML = `<span class="success">✅ Найдено ${Object.keys(relevantDepots).length} депотов</span>`;
                }

                // Генерируем файлы
                const { lua, manifest } = generateFiles(appId, relevantDepots);
                currentLuaContent = lua;
                currentManifestContent = manifest;

                terminalOutput.innerHTML += `\n<span class="success">✅ Готово!</span>`;
                statusBadge.innerHTML = `<span class="badge-success"><i class="fas fa-check-circle"></i> ${Object.keys(relevantDepots).length} депотов</span>`;
                downloadSection.classList.remove('hidden');

            } catch (error) {
                terminalOutput.innerHTML = `<span class="error">⚠️ Ошибка: ${error.message}</span>`;
                statusBadge.innerHTML = `<span class="badge-error"><i class="fas fa-circle-exclamation"></i> Ошибка</span>`;
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<i class="fas fa-cog"></i> Сгенерировать';
            }
        }

        // === СКАЧИВАНИЕ ===
        function downloadFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        downloadLua.addEventListener('click', () => {
            if (currentLuaContent) downloadFile(currentLuaContent, `${gameIdInput.value.trim()}.lua`);
        });

        downloadManifest.addEventListener('click', () => {
            if (currentManifestContent) downloadFile(currentManifestContent, `${gameIdInput.value.trim()}.manifest`);
        });

        generateBtn.addEventListener('click', generate);
        gameIdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generate();
        });

    })();
</script>
</body>
</html>
